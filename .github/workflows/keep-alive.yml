name: Supabase Keep-Alive

on:
  schedule:
    # Run every 3 days at 08:00 UTC
    - cron: '0 8 */3 * *'
  workflow_dispatch: # Allow manual trigger

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        # /api/health runs a query against Postgres, which is what counts as activity
        run: |
          curl -sf "${{ secrets.APP_URL }}/api/health" \
            && echo "Supabase ping successful" \
            || echo "Supabase ping failed (project may already be awake)"
